cargo-features = ["profile-rustflags"]

[package]
name = "pexrc"
version = "0.16.5"
edition = { workspace = true }
publish = false

[workspace]
members = [
    ".",
    "crates/boot",
    "crates/build-system",
    "crates/cache",
    "crates/cli",
    "crates/clib",
    "crates/interpreter",
    "crates/logging",
    "crates/package",
    "crates/pex",
    "crates/pexrs",
    "crates/platform",
    "crates/python-platform",
    "crates/python-proxy",
    "crates/repackage",
    "crates/request",
    "crates/resolver",
    "crates/scripts",
    "crates/target",
    "crates/testing",
    "crates/tools",
    "crates/venv",
    "crates/wheel"
]

[package.metadata.build]
zig_version = "0.16.0"

[package.metadata.build.cargo_binstall]
version = "1.17.4"
artifacts = [
    # N.B.: We don't cover all our targets here. If you develop on an un-covered target, we'll just
    # run: `cargo install --locked cargo_binstall@<version>`. The only drawback is that's pretty
    # slow compared to downloading a pre-built binary.
    {
        target = "arch64-apple-darwin", type = "zip", size = 7094752,
        hash = "sha256:c689061413598fa32b77b6fd2a7300c6392faf008137194ab8a4cdb93c12040a"
    },
    {
        target = "aarch64-pc-windows-msvc", type = "zip", size = 6955036,
        hash = "sha256:6096f3a5da155fcf06f5fe48ee86a0b40427e48d0abb7206e2bc54572f875400"
    },
    {
        target = "aarch64-unknown-linux-gnu", type = "tgz", size = 7564244,
        hash = "sha256:d0e901a56fbcf5ef20d488fcf069b48d3841c07a8a7b713ca5639d32a6da13a5"
    },
    {
        target = "aarch64-unknown-linux-musl", type = "tgz", size = 7558045,
        hash = "sha256:1410ec72b4f23fa6cf8ebb4b55fe03ebca63e14adadf4501d78e91fa004e9689"
    },
    {
        target = "armv7-unknown-linux-gnueabihf", type = "tgz", size = 7279373,
        hash = "sha256:ff488200a04d2ee8d8cbe024b7347158e9835cbdf5677ff4a0a1b91df36d7dad"
    },
    {
        target = "x86_64-apple-darwin", type = "zip", size = 7738226,
        hash = "sha256:278a12a049397b9f73df0c1e6c83c15fe184e3f5d824ee9a66460c41e519cfd6"
    },
    {
        target = "x86_64-pc-windows-msvc", type = "zip", size = 7200526,
        hash = "sha256:9c6df6ed7e0eef153fdd6aa0fe0c873496431ea44e2b209331b2dbd29d0d3c06"
    },
    {
        target = "x86_64-unknown-linux-gnu", type = "tgz", size = 8066818,
        hash = "sha256:556d8572395a50e7a85bface1ab1025fb23856d2221e1207ec3c16a32331891f"
    },
    {
        target = "x86_64-unknown-linux-musl", type = "tgz", size = 8053450,
        hash = "sha256:8822793dd22a1fcfba6d7581ed130ec935fb26a0db58fb9b0f01f0fae17d28f8"
    },
]

[package.metadata.build.embeds]
compression_level = 3

[package.metadata.build.embeds.profiles.release]
profile = "release-embed"
compression_level = 19

# The glibc release timeline for reference: https://sourceware.org/glibc/wiki/Glibc%20Timeline
[package.metadata.build.glibc]
# N.B.: 2.17 if the lowest glibc supported by zig 0.15.2 and this nets us manylinux_2014
# compatibility: https://peps.python.org/pep-0599/
default_version = "2.17"  # Released: 2012-12-25

[package.metadata.build.glibc.by_platform]
# N.B.: These were determined by bisecting to clean builds.
powerpc64le-unknown-linux-gnu = "2.19"  # Released: 2014-02-07
riscv64gc-unknown-linux-gnu = "2.27"  # Released: 2018-02-01

[package.metadata.build.mac_osx_sdk]
url = "https://github.com/joseluisq/macosx-sdks/releases/download/11.3/MacOSX11.3.sdk.tar.xz"
type = "txz"
size = 57683504
fingerprint = {
    algorithm = "sha256", hash = "9adc1373d3879e1973d28ad9f17c9051b02931674a3ec2a2498128989ece2cb1"
}
prefix = "MacOSX11.3.sdk"

[package.metadata.build.virtualenv]
url = "https://raw.githubusercontent.com/pypa/virtualenv/fdfec65ff031997503fb409f365ee3aeb4c2c89f/virtualenv.py"
type = "blob"
size = 106996
fingerprint = {
    algorithm = "sha256", hash = "26497108bbd3a71cada865d712878bc3957fcaebf2bc431357f560f0524e6273"
}

[profile.dev]
# N.B.: This is needed to get a debug build for the Windows clib dll. It turns out COFF only
# supports 2^16 symbols and we have edged over that.
rustflags = ["-Zshare-generics=off"]

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
panic = "abort"

[profile.release-embed]
inherits = "release"
opt-level = "s"

[lib]
name = "pexrc"
path = "src/lib.rs"

[[bin]]
name = "pexrc"
path = "pexrc.rs"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anstream = "1.0"
anyhow = "1.0"
base64 = "0.22"
bstr = "1.12"
chrono = "0.4"
clap = {  version = "4.6", features = ["color", "derive", "string"] }
clap-verbosity-flag = "3.0"
colorchoice-clap = "1.0"
const_format = { version = "0.2", features = ["rust_1_64"] }
csv = "1.4"
dtor = "1.0"
dashmap = "6.1"
digest = "0.11"
dirs = "6.0"
dot-generator = "0.2"
dot-structures = "0.1"
elf = "0.8"
enumset = "1.1"
env_filter = "1.0"
env_logger = "0.11"
flate2 = "1.1"
fs-err = "3.3"
glob = "0.3"
graphviz-rust = "0.9"
hex = "0.4"
include_dir = "0.7"
indexmap = {  version = "2.14", features = ["serde"] }
is_executable = "1.0"
itertools = "0.14"
log = "0.4"
logging_timer = "1.1"
mailparse = "0.16"
oneshot = {  version = "0.2", features = ["std"] }
open = "5.3"
ouroboros = "0.18"
owo-colors = "4.3"
pathdiff = "0.2"
pep440_rs = "0.7"
pep508_rs = "0.9"
plist = "1.9"
pretty_assertions = "1.4"
python-pkginfo = "0.6"
rayon = "1.12"
regex = "1.12"
rfc2047-decoder = "1.1"
rstest = "0.26"
rust-ini = "0.21"
rustix = { version = "1.1", features = ["fs", "system"]}
same-file = "1.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.20", features = ["macros"]}
sha2 = "0.11"
shell-quote = "0.7"
strum = { version = "0.28", features = ["strum_macros"] }
# N.B.: We let strum dictate the strum_macros version.
strum_macros = "*"
tar = "0.4"
target-lexicon = "0.13"
tempfile = "3.27"
textwrap = "0.16"
time = "0.3"
toml = "1.1"
url = "2.5"
# N.B.: We take whatever version is supported by pep440_rs - it uses an optional dependency but
# does not have a feature to activate the dep.
version-ranges = "*"
walkdir = "2.5"
windows-registry = "0.6"
which = "8.0"
xz2 = "0.1"
zip = { version = "8.6", default-features = false, features = ["chrono", "deflate", "zstd"] }
zstd = "0.13"

[build-dependencies]
anyhow = { workspace = true }
bstr = { workspace = true }
build-system = { path = "crates/build-system" }
env_logger = { workspace = true }
fs-err = { workspace = true }
itertools = { workspace = true }
zstd = { workspace = true }

